name: Aktualizacja danych i publikacja

on:
  schedule:
    - cron: "17 3 * * *"   # codziennie ok. 4:17 czasu polskiego
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["state/**", "README.md"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Przywróć stan (cache danych)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: kinoteka-state-${{ github.run_id }}
          restore-keys: kinoteka-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Biblioteki obliczeniowe
        run: pip install numpy pandas scipy

      - name: Dane MovieLens (cache)
        uses: actions/cache@v4
        with:
          path: ml
          key: movielens-ml-32m

      - name: Pobierz dane (Filmweb, TMDB, IMDb, OMDb, Wikidata)
        timeout-minutes: 95
        continue-on-error: true
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          FILMWEB_USER: ${{ vars.FILMWEB_USER || 'Bojryk' }}
          FILMWEB_USER_ID: ${{ vars.FILMWEB_USER_ID || '2570815' }}
          TIME_BUDGET_MIN: "70"
        run: python scripts/update_data.py

      - name: Zapisz stan
        if: always() && hashFiles('state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: kinoteka-state-${{ github.run_id }}

      - name: Złóż stronę
        run: |
          test -s data/catalog.json || { echo "Brak danych – nie publikuję pustej strony"; exit 1; }
          mkdir -p _site
          cp -r index.html app.js style.css sw.js manifest.webmanifest icons data _site/
          sed -i "s/__BUILD__/${GITHUB_RUN_ID}/" _site/sw.js _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
