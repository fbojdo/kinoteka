name: Aktualizacja danych i publikacja

on:
  schedule:
    - cron: "17 3 * * *"   # codziennie ok. 4:17 czasu polskiego
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Przywróć stan (cache danych)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: kinoteka-state-${{ github.run_id }}
          restore-keys: kinoteka-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Przeglądarka do odczytu profilu Filmwebu
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Odczytaj oceny z profilu Filmwebu
        timeout-minutes: 25
        env:
          FILMWEB_USER: ${{ vars.FILMWEB_USER || 'Bojryk' }}
        run: |
          mkdir -p state && rm -f state/filmweb_raw.json
          python scripts/filmweb_scrape.py || true

      - name: Pobierz dane (Filmweb, TMDB, IMDb, OMDb, Wikidata)
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          FILMWEB_USER: ${{ vars.FILMWEB_USER || 'Bojryk' }}
        run: python scripts/update_data.py

      - name: Zapisz stan
        if: always() && hashFiles('state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: kinoteka-state-${{ github.run_id }}

      - name: Złóż stronę
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css sw.js manifest.webmanifest icons data _site/
          sed -i "s/__BUILD__/${GITHUB_RUN_ID}/" _site/sw.js _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
